name: Stacked series source verification

on:
  push:
    branches: [kirill/verify-stacked-series]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stacked-series-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  BASE_SHA: fd652e876a2b059924848a2177c82e67d6752327
  AG_LIBRARY: charts
  AG_SKIP_NATIVE_DEP_VERSION_CHECK: '1'
  AG_DEV_PROMPTS_SKIP_FETCH: '1'
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  NODE_OPTIONS: --max-old-space-size=4096
  SOURCE_SHA: bec53b4495a6866beeeb1dcd727de6162b2dd3bd

jobs:
  native:
    name: Official format, types, lint and unit suites
    if: github.repository == 'popkir/ag-charts' && github.ref == 'refs/heads/kirill/verify-stacked-series'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact source-only fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bec53b4495a6866beeeb1dcd727de6162b2dd3bd
          fetch-depth: 2
          persist-credentials: false
      - name: Set up official toolchain on the disposable runner
        id: setup
        uses: ./.github/actions/setup-nx
        with:
          base_ref: latest
          cache_mode: 'off'
          nx_restore: 'false'
          free_disk_space: 'true'
          tidy_nx_cache: 'false'
          save_yarn_cache: 'false'
      - name: Record and verify source identity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --version
          yarn --version
          git diff --exit-code HEAD -- packages/ag-charts-community/src/chart/data
          printf 'Source under test: %s\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Official format check of the six-file source diff
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: yarn nx format:check --base="$BASE_SHA" --head="$SOURCE_SHA"
      - name: Community types
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: yarn nx build:types ag-charts-community
      - name: Enterprise types
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: yarn nx build:types ag-charts-enterprise
      - name: Community lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: yarn nx lint ag-charts-community
      - name: Enterprise lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: yarn nx lint ag-charts-enterprise
      - name: Full community suite through Nx
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: yarn nx test ag-charts-community -- --maxWorkers=2 --minWorkers=1
      - name: Full enterprise suite through Nx
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: yarn nx test ag-charts-enterprise -- --maxWorkers=2 --minWorkers=1
      - name: Keep native test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stacked-native-reports
          path: |
            reports/ag-charts-community.xml
            reports/ag-charts-enterprise.xml
          if-no-files-found: ignore
          retention-days: 1

  browser:
    name: Official targeted Chromium visual and interaction tests
    if: github.repository == 'popkir/ag-charts' && github.ref == 'refs/heads/kirill/verify-stacked-series'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AG_FORCE_ALL_TESTS: '1'
      AG_E2E_FRAMEWORKS: vanilla
    steps:
      - name: Checkout exact source-only fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bec53b4495a6866beeeb1dcd727de6162b2dd3bd
          fetch-depth: 2
          persist-credentials: false
      - name: Set up official toolchain on the disposable runner
        uses: ./.github/actions/setup-nx
        with:
          base_ref: latest
          cache_mode: 'off'
          nx_restore: 'false'
          free_disk_space: 'true'
          tidy_nx_cache: 'false'
          save_yarn_cache: 'false'
      - name: Verify the exact source under browser test
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code HEAD -- packages/ag-charts-community/src/chart/data
          printf 'Browser source under test: %s\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Nx-managed browser and image comparisons, with no snapshot updates
        run: >-
          yarn nx test:e2e ag-charts-website --
          bar-series.spec.ts legend.spec.ts tooltip.spec.ts
          api-events.spec.ts state.spec.ts context-menu.spec.ts
          --project=chromium
      - name: Keep browser results and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stacked-browser-reports
          path: |
            reports/ag-charts-website-e2e.xml
            reports/ag-charts-website-e2e.json
            reports/ag-charts-website-e2e-html
            reports/ag-charts-website-e2e-reports
          if-no-files-found: ignore
          retention-days: 1

  browser_baseline:
    name: Upstream baseline Chromium comparison
    if: github.repository == 'popkir/ag-charts' && github.ref == 'refs/heads/kirill/verify-stacked-series'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: fd652e876a2b059924848a2177c82e67d6752327
      AG_FORCE_ALL_TESTS: '1'
      AG_E2E_FRAMEWORKS: vanilla
    steps:
      - name: Checkout exact source-only fix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fd652e876a2b059924848a2177c82e67d6752327
          fetch-depth: 2
          persist-credentials: false
      - name: Set up official toolchain on the disposable runner
        uses: ./.github/actions/setup-nx
        with:
          base_ref: latest
          cache_mode: 'off'
          nx_restore: 'false'
          free_disk_space: 'true'
          tidy_nx_cache: 'false'
          save_yarn_cache: 'false'
      - name: Verify the exact source under browser test
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code HEAD -- packages/ag-charts-community/src/chart/data
          printf 'Browser source under test: %s\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Nx-managed browser and image comparisons, with no snapshot updates
        run: >-
          yarn nx test:e2e ag-charts-website --
          bar-series.spec.ts legend.spec.ts tooltip.spec.ts
          api-events.spec.ts state.spec.ts context-menu.spec.ts
          --project=chromium
      - name: Keep browser results and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stacked-browser-baseline-reports
          path: |
            reports/ag-charts-website-e2e.xml
            reports/ag-charts-website-e2e.json
            reports/ag-charts-website-e2e-html
            reports/ag-charts-website-e2e-reports
          if-no-files-found: ignore
          retention-days: 1
