name: Full render of 7293 stacked series
on:
  push:
    branches: [kirill/benchmark-7293-render]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: many-series-full-render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  render:
    name: Paired 7293-series browser rendering
    if: github.repository == 'popkir/ag-charts' && github.ref == 'refs/heads/kirill/benchmark-7293-render'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/benchmark
            tools/full-render-7293
            package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
      - name: Install isolated browser runner dependencies
        run: |
          mkdir -p tmp/render-tools
          npm install --prefix tmp/render-tools --no-save --no-audit --no-fund playwright@1.60.0 pngjs@7.0.0 pixelmatch@5.3.0 tsx@4.23.15
          tmp/render-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Prepare exact archived source-built bundles and shared benchmark helpers
        run: python3 tools/full-render-7293/prepare.py
      - name: Pilot and visual audit with 32 series
        id: pilot
        run: tmp/render-tools/node_modules/.bin/tsx tools/full-render-7293/run.mjs --pilot
      - name: Full render pair 1 - baseline then candidate
        if: ${{ !cancelled() && steps.pilot.outcome == 'success' }}
        run: tmp/render-tools/node_modules/.bin/tsx tools/full-render-7293/run.mjs --pair 1
      - name: Full render pair 2 - candidate then baseline
        if: ${{ !cancelled() && steps.pilot.outcome == 'success' }}
        run: tmp/render-tools/node_modules/.bin/tsx tools/full-render-7293/run.mjs --pair 2
      - name: Full render pair 3 - baseline then candidate
        if: ${{ !cancelled() && steps.pilot.outcome == 'success' }}
        run: tmp/render-tools/node_modules/.bin/tsx tools/full-render-7293/run.mjs --pair 3
      - name: Compare full render timings, complete bar geometry and pixels
        if: ${{ !cancelled() && steps.pilot.outcome == 'success' }}
        run: tmp/render-tools/node_modules/.bin/tsx tools/full-render-7293/run.mjs --summarise
      - name: Retain every raw render result and failure record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: full-render-7293-results
          path: reports/full-render-7293
          retention-days: 30
          if-no-files-found: warn
