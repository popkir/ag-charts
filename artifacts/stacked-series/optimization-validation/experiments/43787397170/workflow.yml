name: Stacked optimisation public behaviour matrix
on:
  push:
    branches: [kirill/experiment-stacked-7293-matrix]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: stacked-optimisation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic:
    if: github.repository == 'popkir/ag-charts' && github.ref == 'refs/heads/kirill/experiment-stacked-7293-matrix'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            tools/benchmark
            tools/stacked-optimization
            package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
      - name: Install isolated browser runner
        run: |
          mkdir -p tmp/render-tools
          npm install --prefix tmp/render-tools --no-save --no-audit --no-fund playwright@1.60.0 pngjs@7.0.0 pixelmatch@5.3.0 tsx@4.23.15
          tmp/render-tools/node_modules/.bin/playwright install --with-deps chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: stacked-optimization-builds
          path: tmp/stacked-optimization-builds
          run-id: 43786659217
          github-token: ${{ github.token }}
      - name: Prepare existing capture helper and synthetic behaviour fixture
        run: python3 tools/stacked-optimization/prepare-matrix.py
      - name: Differential public API, legend, interaction and export checks
        run: tmp/render-tools/node_modules/.bin/tsx tools/stacked-optimization/run-matrix.mjs
      - name: Retain raw profiles, audits and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stacked-optimization-matrix
          path: tmp/stacked-optimization-matrix
          retention-days: 30
          if-no-files-found: warn
