  upstream_baseline:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      AG_FORCE_ALL_TESTS: '1'
      AG_E2E_FRAMEWORKS: vanilla,typescript,reactFunctional,reactFunctionalTs,angular,vue3
      AG_SCENE_SNAPSHOTS: diff
      NX_BASE: 9ee57509a4141b2477b6c3220efac87e1010982a
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
