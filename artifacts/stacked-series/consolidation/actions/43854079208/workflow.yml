name: Stacked series synced latest verification
'on':
  push:
    branches:
    - kirill/evidence-stacked-series
    paths:
    - .github/workflows/stacked-series-validation.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: stacked-merged-verification
  cancel-in-progress: false
env:
  CI: 'true'
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  AG_LIBRARY: charts
  AG_SKIP_NATIVE_DEP_VERSION_CHECK: '1'
  AG_DEV_PROMPTS_SKIP_FETCH: '1'
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  NODE_OPTIONS: --max-old-space-size=4096
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ae4e8907037ca9aec35f19d6898d3cfb8da84721
        fetch-depth: 24
        persist-credentials: false
    - uses: ./.github/actions/setup-nx
      with:
        base_ref: kirill/perf-stacked-series
        fetch_base: 'false'
        cache_mode: 'off'
        nx_restore: 'false'
        free_disk_space: 'true'
        tidy_nx_cache: 'false'
        save_yarn_cache: 'false'
    - name: Verify exact committed source and record identity
      run: |-
        python3 - <<'PYGUARD'
        import json,subprocess,pathlib
        sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
        assert sha=='ae4e8907037ca9aec35f19d6898d3cfb8da84721' and tree=='757aa8f66a63ddcab10e42735eea39d3cd44dc88',(sha,tree)
        subprocess.run(['git','diff','--exit-code','HEAD','--','packages','yarn.lock','nx.json','esbuild.config.cjs'],check=True)
        p=pathlib.Path('tmp/stacked-merged-proofs');p.mkdir(parents=True,exist_ok=True)
        (p/'source.json').write_text(json.dumps({'head':sha,'tree':tree,'upstreamLatest':'9ee57509a4141b2477b6c3220efac87e1010982a'},indent=2)+'\n')
        print('Exact source verified',sha,tree)
        PYGUARD
    - name: Official formatter and check
      run: |-
        yarn nx format --files='packages/ag-charts-community/src/chart/chart.ts,packages/ag-charts-community/src/chart/data/aggregateFunctions.test.ts,packages/ag-charts-community/src/chart/data/aggregateFunctions.ts,packages/ag-charts-community/src/chart/data/data-model/grouping/dataGrouper.test.ts,packages/ag-charts-community/src/chart/data/data-model/grouping/dataGrouper.ts,packages/ag-charts-community/src/chart/data/data-model/utils/resolvers.ts,packages/ag-charts-community/src/chart/data/dataController.test.ts,packages/ag-charts-community/src/chart/data/dataController.ts,packages/ag-charts-community/src/chart/data/dataModel.test.ts,packages/ag-charts-community/src/chart/legend/legendManager.test.ts,packages/ag-charts-community/src/chart/legend/legendManager.ts,packages/ag-charts-community/src/chart/series/seriesStateManager.test.ts,packages/ag-charts-community/src/chart/series/seriesStateManager.ts'
        yarn nx format:check --files='packages/ag-charts-community/src/chart/chart.ts,packages/ag-charts-community/src/chart/data/aggregateFunctions.test.ts,packages/ag-charts-community/src/chart/data/aggregateFunctions.ts,packages/ag-charts-community/src/chart/data/data-model/grouping/dataGrouper.test.ts,packages/ag-charts-community/src/chart/data/data-model/grouping/dataGrouper.ts,packages/ag-charts-community/src/chart/data/data-model/utils/resolvers.ts,packages/ag-charts-community/src/chart/data/dataController.test.ts,packages/ag-charts-community/src/chart/data/dataController.ts,packages/ag-charts-community/src/chart/data/dataModel.test.ts,packages/ag-charts-community/src/chart/legend/legendManager.test.ts,packages/ag-charts-community/src/chart/legend/legendManager.ts,packages/ag-charts-community/src/chart/series/seriesStateManager.test.ts,packages/ag-charts-community/src/chart/series/seriesStateManager.ts'
    - name: Verify exact committed source and record identity
      run: |-
        python3 - <<'PYGUARD'
        import json,subprocess,pathlib
        sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
        assert sha=='ae4e8907037ca9aec35f19d6898d3cfb8da84721' and tree=='757aa8f66a63ddcab10e42735eea39d3cd44dc88',(sha,tree)
        subprocess.run(['git','diff','--exit-code','HEAD','--','packages','yarn.lock','nx.json','esbuild.config.cjs'],check=True)
        p=pathlib.Path('tmp/stacked-merged-proofs');p.mkdir(parents=True,exist_ok=True)
        (p/'source.json').write_text(json.dumps({'head':sha,'tree':tree,'upstreamLatest':'9ee57509a4141b2477b6c3220efac87e1010982a'},indent=2)+'\n')
        print('Exact source verified',sha,tree)
        PYGUARD
    - name: Community types
      run: yarn nx build:types ag-charts-community
    - name: Enterprise types
      run: yarn nx build:types ag-charts-enterprise
    - name: Community lint
      run: yarn nx lint ag-charts-community
    - name: Enterprise lint
      run: yarn nx lint ag-charts-enterprise
    - name: Hot path analysis
      run: node tools/hot-paths/detect.js --range 9ee57509a4141b2477b6c3220efac87e1010982a...ae4e8907037ca9aec35f19d6898d3cfb8da84721
        > tmp/stacked-merged-proofs/hot-paths.json
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: stacked-merged-quality
        path: tmp/stacked-merged-proofs
        retention-days: 30
    if: github.repository == 'popkir/ag-charts' && github.ref == 'refs/heads/kirill/evidence-stacked-series'
