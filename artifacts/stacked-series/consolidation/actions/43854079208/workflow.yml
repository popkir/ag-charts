        subprocess.run(['git','diff','--exit-code','HEAD','--','packages','yarn.lock','nx.json','esbuild.config.cjs'],check=True)
        p=pathlib.Path('tmp/stacked-merged-proofs');p.mkdir(parents=True,exist_ok=True)
        (p/'source.json').write_text(json.dumps({'head':sha,'tree':tree,'upstreamLatest':'9ee57509a4141b2477b6c3220efac87e1010982a'},indent=2)+'\n')
        print('Exact source verified',sha,tree)
