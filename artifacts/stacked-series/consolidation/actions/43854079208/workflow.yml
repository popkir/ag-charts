        print('Exact source verified',sha,tree)
        PYGUARD
    - name: Generate official API reference prerequisite
      run: yarn nx docs-resolved-interfaces ag-charts-types
    - name: Unmodified latest keyboard and tooltip Chromium comparison
      id: chromium
      run: yarn nx test:e2e ag-charts-website -- keyboard-nav.spec.ts interactive-tooltip.spec.ts --project=chromium
    - name: Unmodified latest complete standard Firefox and WebKit comparison
      if: ${{ !cancelled() }}
      env:
        AG_E2E_REPORT_JSON: ./reports/ag-charts-website-e2e-cross-browser.json
      run: yarn nx test:e2e ag-charts-website -- --config playwright.cross-browser.config.ts
